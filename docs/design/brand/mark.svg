<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Cursus">
  <title>Cursus — marque « flux » (fan-out / join)</title>
  <!-- Marque maîtresse, monochrome. `currentColor` la rend teintable :
       gabarit de barre de menus, filigrane, favicon, usage sur aplat. -->
  <path d="M22 50 L50 28 L78 50 L50 72 Z"
        fill="none" stroke="currentColor" stroke-width="7"
        stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="currentColor">
    <circle cx="22" cy="50" r="8"/>
    <circle cx="50" cy="28" r="8"/>
    <circle cx="78" cy="50" r="8"/>
    <circle cx="50" cy="72" r="8"/>
  </g>
</svg>
