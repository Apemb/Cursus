<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Cursus — un run tourne">
  <title>Cursus — barre de menus, en cours (référence d'animation)</title>
  <!-- RÉFÉRENCE d'animation, pas l'asset livré. Le vert remplit le périmètre du
       diamant et tourne ; le monochrome le reprend derrière (moitié / moitié).
       En production : générer ≈16–24 frames de ce mouvement et les permuter sur un
       timer (Avalonia n'anime pas le tray nativement), timer coupé au repos.

       Périmètre = 142.44 unités (4 arêtes égales de 35.61). La bande révélatrice
       fait la moitié : stroke-dasharray = 71.22 71.22 ; offset animé 0 → -142.44. -->
  <style>
    .flow-band { animation: cursus-flow 2.8s linear infinite; }
    @keyframes cursus-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -142.44; } }
    @media (prefers-reduced-motion: reduce) { .flow-band { animation: none; } }
  </style>

  <defs>
    <mask id="cursusFlow" maskUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="#000"/>
      <path class="flow-band" d="M22 50 L50 28 L78 50 L50 72 Z"
            fill="none" stroke="#fff" stroke-width="24"
            stroke-linejoin="round" stroke-linecap="round"
            stroke-dasharray="71.22 71.22"/>
    </mask>
  </defs>

  <!-- Silhouette monochrome (base, teintée par le système en réel) -->
  <g fill="#000" stroke="#000">
    <path d="M22 50 L50 28 L78 50 L50 72 Z" fill="none" stroke-width="7"
          stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="22" cy="50" r="8"/><circle cx="50" cy="28" r="8"/>
    <circle cx="78" cy="50" r="8"/><circle cx="50" cy="72" r="8"/>
  </g>

  <!-- Copie verte, révélée par la bande qui tourne -->
  <g mask="url(#cursusFlow)">
    <path d="M22 50 L50 28 L78 50 L50 72 Z" fill="none" stroke="#22C55E" stroke-width="7"
          stroke-linejoin="round" stroke-linecap="round"/>
    <g fill="#22C55E">
      <circle cx="22" cy="50" r="8"/><circle cx="50" cy="28" r="8"/>
      <circle cx="78" cy="50" r="8"/><circle cx="50" cy="72" r="8"/>
    </g>
  </g>
</svg>
