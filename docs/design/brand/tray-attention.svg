<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Cursus — attention">
  <title>Cursus — barre de menus, attention (dernier run échoué)</title>
  <!-- Aperçu composite. En production, la silhouette reste un GABARIT teinté par le
       système ; la pastille colorée se compose PAR-DESSUS au runtime (elle ne peut pas
       vivre dans une image-gabarit, qui est monochrome). Ici en noir pour la prévisu. -->
  <path d="M22 50 L50 28 L78 50 L50 72 Z"
        fill="none" stroke="#000" stroke-width="7"
        stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#000">
    <circle cx="22" cy="50" r="8"/>
    <circle cx="50" cy="28" r="8"/>
    <circle cx="78" cy="50" r="8"/>
    <circle cx="50" cy="72" r="8"/>
  </g>
  <!-- Pastille d'état (composée au runtime) -->
  <circle cx="82" cy="22" r="17" fill="#EF4444" stroke="#fff" stroke-width="6"/>
</svg>
